services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: oms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oms"]
      interval: 10s
      retries: 5
    networks:
      - oms_net

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
    networks:
      - oms_net

  kafka:
    image: apache/kafka:3.7.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    networks:
      - oms_net

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand({ ping: 1 }).ok"]
      interval: 10s
      retries: 5
    networks:
      - oms_net

  app_1: &app
    build: .
    environment:
      OMS_DB_URL: jdbc:postgresql://postgres:5432/oms
      OMS_DB_USER: postgres
      OMS_DB_PASSWORD: postgres
      OMS_REDIS_HOST: redis
      OMS_REDIS_PORT: "6379"
      OMS_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OMS_CQRS_USE_MONGO: "true"
      OMS_MONGO_URI: mongodb://mongo:27017
      OMS_MONGO_DB: oms
      OMS_KEYSTORE_PATH: /app/keystore.jks
      OMS_KEYSTORE_PASS: changeit
      OMS_ARCHIVE_DIR: /app/audit-archives
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
    volumes:
      - audit_archives:/app/audit-archives
    networks:
      - oms_net

  app_2:
    <<: *app  # same image and config, different container name

  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app_1
      - app_2
    networks:
      - oms_net

networks:
  oms_net:

volumes:
  pgdata:
  audit_archives:
