<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Dark charcoal background -->
  <rect width="32" height="32" rx="7" fill="#111827"/>
  <!-- Teal trend line -->
  <polyline
    points="5,22 10,16 15,19 27,8"
    stroke="#14B8A6"
